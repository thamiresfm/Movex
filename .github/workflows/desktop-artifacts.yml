# Gera instaladores e publica na aba *Actions* (Artefatos) — **não** cria GitHub Release.
#
# Disparo:
#   - Manual: repositório → **Actions** → *Desktop — DMG e EXE* → **Run workflow**
#   - Automático: **push** em `main` que altere `src/`, Tauri, dependências ou este workflow
#
# **Artefatos** (fim de cada *job*): *Movex-macos-universal-dmg* (.dmg) e *Movex-windows-exe-msi* (.exe + .msi).
# Para ficheiros na página **Releases** do GitHub, use: `git tag v0.x.y && git push origin v0.x.y` (workflow *Release*).
name: 'Desktop — DMG e EXE (artefatos)'

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'src-tauri/**'
      - '.github/workflows/desktop-artifacts.yml'

concurrency:
  group: desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-dmg:
    name: macOS — .dmg (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-macos-${{ hashFiles('**/Cargo.lock', 'package-lock.json') }}
          restore-keys: desktop-macos-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tauri build (universal)
        run: npm exec -- tauri build --target universal-apple-darwin

      - name: Listar ficheiros bundle (resumo)
        run: find src-tauri/target -path '*bundle*' -type f 2>/dev/null | head -50 || true

      - name: Publicar .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Movex-macos-universal-dmg
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
          # DMG é já comprimido
          compression-level: 0

      - name: Resumo
        if: success()
        run: |
          echo "## Instalador macOS (.dmg)" >> "$GITHUB_STEP_SUMMARY"
          echo "Artefato: **Movex-macos-universal-dmg** — faça download no final do job." >> "$GITHUB_STEP_SUMMARY"

  windows-exe:
    name: Windows — .exe / .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-win-${{ hashFiles('**/Cargo.lock', 'package-lock.json') }}
          restore-keys: desktop-win-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tauri build (x64)
        shell: bash
        run: npm exec -- tauri build

      - name: Listar ficheiros bundle (resumo)
        shell: bash
        run: find src-tauri/target -path '*bundle*' -type f 2>/dev/null | head -50 || true

      - name: Publicar .exe e .msi
        uses: actions/upload-artifact@v4
        with:
          name: Movex-windows-exe-msi
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
          compression-level: 0

      - name: Resumo
        if: success()
        shell: bash
        run: |
          echo "## Instaladores Windows (.exe / .msi)" >> "$GITHUB_STEP_SUMMARY"
          echo "Artefato: **Movex-windows-exe-msi** — contém o instalador NSIS (.exe) e, se existir, o .msi." >> "$GITHUB_STEP_SUMMARY"
