# Gera instaladores e publica na aba *Actions* (Artefatos) — **não** cria GitHub Release.
#
# Disparo:
#   - Manual: repositório → **Actions** → *Desktop — DMG e EXE* → **Run workflow**
#   - Automático: **push** em `main` que altere `src/`, Tauri, dependências ou este workflow
#
# Artefatos: *Movex-macos-universal-dmg* (.dmg) e *Movex-windows-exe-msi* (.exe + .msi).
# O job **validate** corre primeiro (clippy, cargo test, Vitest, Vite).
# Para ficheiros na página **Releases** do GitHub, use: `git tag v0.x.y && git push origin v0.x.y` (workflow *Release*).
name: 'Desktop — DMG e EXE (artefatos)'

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'src-tauri/**'
      - '.github/workflows/desktop-artifacts.yml'

concurrency:
  group: desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Clippy, Rust, Vitest e Vite (obrigatório antes do Tauri)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu24-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu24-cargo-
      - name: Instalar dependências Linux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config \
            cmake nasm clang libdbus-1-dev
      - name: Clippy (warnings como erros)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings 2>&1
      - name: Testes Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: npm ci, Vitest e build Vite
        run: |
          echo "=== Diretório de trabalho ==="
          pwd
          echo "=== package.json (scripts) ==="
          node -e "const p=require('./package.json'); console.log(JSON.stringify({version:p.version,scripts:p.scripts},null,2))"
          echo "=== Instalar ==="
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          echo "=== vitest instalado? ==="
          npm list vitest --depth=0 2>/dev/null || echo "AVISO: vitest não encontrado"
          echo "=== Testes ==="
          npm run test
          echo "=== Build ==="
          npm run build

  macos-dmg:
    name: macOS — .dmg (universal)
    needs: [validate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-macos-${{ hashFiles('**/Cargo.lock', 'package-lock.json') }}
          restore-keys: desktop-macos-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tauri build (universal)
        run: |
          set -e
          npm exec -- tauri build --target universal-apple-darwin
          echo "=== Build concluído — bundle dir ==="
          ls src-tauri/target/universal-apple-darwin/release/bundle/ 2>/dev/null \
            || echo "AVISO: bundle dir não encontrado"

      - name: Listar e copiar DMG para pasta fixa
        run: |
          set -e
          mkdir -p _artifacts_dmg
          echo "=== Procurar DMG na árvore ==="
          found=0
          while IFS= read -r f; do
            echo "Copiando: $f"
            cp "$f" _artifacts_dmg/
            found=$((found + 1))
          done < <(find . -name "*.dmg" -type f 2>/dev/null)
          echo "--- Ficheiros copiados: $found ---"
          ls -lh _artifacts_dmg/
          if [ "$found" -eq 0 ]; then
            echo "ERRO: Nenhum DMG encontrado após tauri build!"
            exit 1
          fi

      - name: Publicar .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Movex-macos-universal-dmg
          path: _artifacts_dmg/
          if-no-files-found: error
          # DMG é já comprimido
          compression-level: 0
          retention-days: 7

      - name: Resumo
        if: success()
        run: |
          echo "## Instalador macOS (.dmg)" >> "$GITHUB_STEP_SUMMARY"
          echo "Artefato: **Movex-macos-universal-dmg** — faça download no final do job." >> "$GITHUB_STEP_SUMMARY"

  windows-exe:
    name: Windows — .exe / .msi
    needs: [validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-win-${{ hashFiles('**/Cargo.lock', 'package-lock.json') }}
          restore-keys: desktop-win-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tauri build (x64)
        shell: bash
        run: |
          set -e
          npm exec -- tauri build
          echo "=== Build concluído — bundle dir ==="
          ls src-tauri/target/release/bundle/ 2>/dev/null \
            || ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/ 2>/dev/null \
            || echo "AVISO: bundle dir não encontrado (tauri pode ter falhado)"

      - name: Listar e copiar .exe/.msi para pasta fixa
        shell: bash
        run: |
          set -e
          mkdir -p _artifacts_win
          echo "=== Conteúdo de src-tauri/ ==="
          ls -la src-tauri/ 2>/dev/null || echo "(src-tauri/ inacessível)"
          echo "=== Procurar instaladores na árvore ==="
          found=0
          while IFS= read -r f; do
            echo "Copiando: $f"
            cp "$f" _artifacts_win/
            found=$((found + 1))
          done < <(find . \( -path "*/bundle/nsis/*.exe" -o -path "*/bundle/msi/*.msi" \) -type f 2>/dev/null)
          echo "--- Ficheiros copiados: $found ---"
          ls -lh _artifacts_win/
          if [ "$found" -eq 0 ]; then
            echo "ERRO: Nenhum instalador encontrado após tauri build!"
            exit 1
          fi

      - name: Publicar .exe e .msi
        uses: actions/upload-artifact@v4
        with:
          name: Movex-windows-exe-msi
          path: _artifacts_win/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Resumo
        if: success()
        shell: bash
        run: |
          echo "## Instaladores Windows (.exe / .msi)" >> "$GITHUB_STEP_SUMMARY"
          echo "Artefato: **Movex-windows-exe-msi** — contém o instalador NSIS (.exe) e, se existir, o .msi." >> "$GITHUB_STEP_SUMMARY"
