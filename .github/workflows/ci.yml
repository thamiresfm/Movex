# CI em push para main e em PRs — build (Rust + Vite) e artefato movex-frontend-dist.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Evita filas desnecessárias no mesmo ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Build (Rust + Vite) e artefato dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu24-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu24-cargo-
      - name: Instalar dependências Linux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config \
            cmake nasm clang libdbus-1-dev
      - name: Clippy (warnings como erros)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings 2>&1
      - name: Testes Rust (crate completo)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci, testes Vitest e build Vite
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run test
          npm run build

      - name: Metadados do build (rastreio)
        run: |
          {
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            node -e "process.stdout.write('version=' + require('./package.json').version + '\n')"
          } | tee dist/BUILD-INFO.txt

      - name: Publicar artefato (frontend Vite)
        uses: actions/upload-artifact@v4
        with:
          name: movex-frontend-dist
          path: dist/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Resumo (CI vs Release)
        if: success()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## O que este workflow (CI) faz

          | Etapa | Conteúdo |
          |------|----------|
          | **Rust** | `cargo clippy` (lib) e `cargo test` (crate) |
          | **Web** | `npm run test` (Vitest) e `npm run build` (Vite) |
          | **Artefato** | `movex-frontend-dist` = pasta `dist/` + `BUILD-INFO.txt` (versão, ref, SHA) |

          ## Instaladores .dmg / .exe / .msi

          | Objetivo | Workflow | Como disparar |
          |----------|----------|----------------|
          | **Artefatos** na aba *Actions* (sem Release) | **Desktop — DMG e EXE (artefatos)** | *Actions* → escolher o workflow → *Run workflow* |
          | **GitHub Release** com anexos | **Release** | Push de tag `v*` (ex.: abaixo) |

          ```bash
          git tag v0.3.10
          git push origin v0.3.10
          ```

          Depois: **Releases** no GitHub, ou **Actions** → *Desktop — …* → *Artefatos do run*.

          O rodapé *Job summary generated at run-time* vem do GitHub (não é editável por este repositório).
          EOF
