name: Build Movex

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Lint + Testes Rust — roda em PRs e tags; bloqueia merge se falhar
  # ──────────────────────────────────────────────────────────────
  test:
    name: Lint e Testes Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu24-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu24-cargo-
      - name: Instalar dependências Linux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config \
            cmake nasm clang libdbus-1-dev
      - name: Clippy (warnings como erros)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings 2>&1
      - name: Testes unitários
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1

  # ──────────────────────────────────────────────────────────────
  # Build macOS — apenas em tags v*
  # ──────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # package-lock.json não está versionado — usar install
      - run: npm install

      # Criar o release draft primeiro para ter o releaseId
      - name: Criar release no GitHub
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: "Movex ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Movex ${{ github.ref_name }}

            Controle múltiplos computadores com um único teclado e mouse pela rede local.

            ### 📦 Downloads

            | Plataforma | Arquivo |
            |---|---|
            | macOS (Apple Silicon + Intel) | `Movex_*_universal.dmg` |
            | Windows 10/11 x64 | `Movex_*_x64_en-US.msi` |
            | Windows 10/11 x64 | `Movex_*_x64-setup.exe` |

            ### 🚀 Como usar
            1. Instale o Movex nos dois computadores
            2. No principal → **Servidor**
            3. No outro → **Cliente** com a mesma chave de segurança
            4. Mova o cursor para a borda da tela para passar o controle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e upload macOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.create_release.outputs.id }}
          args: --target universal-apple-darwin

  # ──────────────────────────────────────────────────────────────
  # Build Windows — apenas em tags v*
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm install

      # Buscar o releaseId criado pelo job macOS
      - name: Obter release ID
        id: get_release
        shell: bash
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "Release ID: $RELEASE_ID"

      # Opcional: repositórios sem PFX ainda geram .msi/.exe (sem assinatura de código)
      - name: Decodificar certificado de assinatura
        if: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $cert = "${{ secrets.WINDOWS_CERTIFICATE }}"
          $certBytes = [Convert]::FromBase64String($cert)
          [IO.File]::WriteAllBytes("$env:TEMP\movex-cert.pfx", $certBytes)
          Write-Host "Certificado decodificado."

      - name: Instalar certificado no Windows
        if: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $pwd = ConvertTo-SecureString "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          Import-PfxCertificate -FilePath "$env:TEMP\movex-cert.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $pwd
          Write-Host "Certificado instalado."

      - name: Build e upload Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY: chave Ed25519 minisign para assinar bundles de update
          # (diferente do WINDOWS_CERTIFICATE que é o PFX de code signing do executável)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.get_release.outputs.id }}
