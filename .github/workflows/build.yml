name: Build Movex

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

# Forçar Node.js 24 em todas as actions JavaScript
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Testes Rust
  # ──────────────────────────────────────────────────────────────
  test:
    name: Testes Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu24-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu24-cargo-

      - name: Instalar dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config

      - name: Testes
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # ──────────────────────────────────────────────────────────────
  # Job 2: Build macOS Universal Binary
  # ──────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build Tauri macOS
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg,app
        env:
          RUST_LOG: info
          CI: "true"

      - name: Localizar e copiar artefatos macOS
        run: |
          echo "=== Procurando .dmg em todo o target/ ==="
          find src-tauri/target -name "*.dmg" 2>/dev/null || echo "Nenhum .dmg encontrado"

          echo ""
          echo "=== Estrutura de bundle ==="
          find src-tauri/target -type d -name "bundle" 2>/dev/null
          find src-tauri/target -type d -name "dmg" 2>/dev/null

          mkdir -p artifacts-macos
          find src-tauri/target -name "*.dmg" -exec cp -v {} artifacts-macos/ \; 2>/dev/null
          find src-tauri/target -name "*.pkg" -exec cp -v {} artifacts-macos/ \; 2>/dev/null

          echo ""
          echo "=== Conteúdo de artifacts-macos/ ==="
          ls -lah artifacts-macos/ || echo "(vazio)"

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: Movex-macOS
          path: artifacts-macos/
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build Windows x64
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build Tauri Windows
        run: npm run tauri build -- --bundles msi,nsis
        env:
          RUST_LOG: info
          CI: "true"

      - name: Localizar e copiar artefatos Windows
        shell: pwsh
        run: |
          Write-Host "=== Procurando .msi e .exe em target/ ==="
          Get-ChildItem -Recurse src-tauri/target -Include *.msi,*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*bundle*" } |
            Select-Object FullName

          New-Item -ItemType Directory -Force -Path artifacts-windows | Out-Null

          Get-ChildItem -Recurse src-tauri/target -Include *.msi -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*bundle*" } |
            ForEach-Object { Copy-Item $_.FullName artifacts-windows/ -Verbose }

          Get-ChildItem -Recurse src-tauri/target -Include *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*bundle*" } |
            ForEach-Object { Copy-Item $_.FullName artifacts-windows/ -Verbose }

          Write-Host "=== Conteúdo de artifacts-windows/ ==="
          Get-ChildItem artifacts-windows/ -ErrorAction SilentlyContinue

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Movex-Windows
          path: artifacts-windows/
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 4: Publicar Release (apenas em tags v*)
  # ──────────────────────────────────────────────────────────────
  release:
    name: Publicar Release GitHub
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Baixar artefatos macOS
        uses: actions/download-artifact@v4
        with:
          name: Movex-macOS
          path: release-assets/macos
        continue-on-error: true

      - name: Baixar artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: Movex-Windows
          path: release-assets/windows
        continue-on-error: true

      - name: Listar artefatos para release
        run: |
          echo "=== Artefatos disponíveis ==="
          find release-assets -type f | sort || echo "(nenhum)"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Movex ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Movex ${{ github.ref_name }}

            Controle múltiplos computadores com um único teclado e mouse pela rede local.

            ---

            ### 📦 Downloads

            | Plataforma | Arquivo | Requisito |
            |---|---|---|
            | **macOS** | `Movex_*.dmg` | macOS 12+ · Apple Silicon + Intel |
            | **Windows** | `Movex_*.msi` | Windows 10/11 · x64 |
            | **Windows** | `Movex_*.exe` | Windows 10/11 · x64 |

            ---

            ### 🚀 Como usar

            1. Instale o Movex nos **dois** computadores
            2. No computador principal, selecione **Servidor**
            3. No outro, selecione **Cliente** e use a mesma chave de segurança
            4. Mova o cursor para a **borda da tela** para passar o controle
          files: |
            release-assets/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
