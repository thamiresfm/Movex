name: Build Movex

on:
  # Builds completos APENAS em tags v* (release)
  push:
    tags:
      - 'v*'
  # Em PRs e push na main: só testes (rápido, ~5 min)
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Testes Rust — roda em TODOS os eventos (~5 min no Linux)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Testes Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu24-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu24-cargo-

      - name: Instalar dependências Linux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config

      - name: Testes
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # ──────────────────────────────────────────────────────────────
  # Build macOS — APENAS em tags v*
  # macOS consome 10x mais minutos que Linux
  # ──────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build Tauri macOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin

      - name: Copiar artefatos
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target -name "*.dmg" 2>/dev/null | xargs -I{} cp {} artifacts/ || true
          ls -lah artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: Movex-macOS
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Build Windows — APENAS em tags v*
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build Tauri Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copiar artefatos
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target -path "*/bundle/msi/*.msi" | xargs -I{} cp {} artifacts/ 2>/dev/null || true
          find src-tauri/target -path "*/bundle/nsis/*.exe" | xargs -I{} cp {} artifacts/ 2>/dev/null || true
          ls -lah artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: Movex-Windows
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Release — APENAS em tags v*, após builds concluídos
  # ──────────────────────────────────────────────────────────────
  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Movex-macOS
          path: release-assets/
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: Movex-Windows
          path: release-assets/
        continue-on-error: true

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Movex ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Movex ${{ github.ref_name }}

            Controle múltiplos computadores com um único teclado e mouse pela rede local.

            ### 📦 Downloads

            | Plataforma | Arquivo | Requisito |
            |---|---|---|
            | **macOS** | `Movex_*.dmg` | macOS 12+ · Apple Silicon + Intel |
            | **Windows** | `Movex_*.msi` | Windows 10/11 · x64 |
            | **Windows** | `Movex_*.exe` | Windows 10/11 · x64 |

            ### 🚀 Como usar
            1. Instale o Movex nos dois computadores
            2. No principal, selecione **Servidor**
            3. No outro, selecione **Cliente** com a mesma chave
            4. Mova o cursor para a borda para passar o controle
          files: release-assets/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
