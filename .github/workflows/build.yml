name: Build Movex

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Testes Rust
  # ──────────────────────────────────────────────────────────────
  test:
    name: Testes Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu24-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu24-cargo-

      - name: Instalar dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config

      - name: Testes
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # ──────────────────────────────────────────────────────────────
  # Job 2: Build macOS + Windows usando tauri-action oficial
  # ──────────────────────────────────────────────────────────────
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            name: macOS
          - platform: windows-latest
            args: ''
            rust-targets: ''
            name: Windows

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-

      - run: npm ci

      - name: Build e gerar instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Listar artefatos gerados
        shell: bash
        run: |
          echo "=== Artefatos gerados ==="
          find src-tauri/target -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.app" 2>/dev/null | grep -v "/deps/" | grep -v "\.dSYM" | head -20 || true

      - name: Copiar artefatos para pasta de upload
        shell: bash
        run: |
          mkdir -p artifacts
          # macOS
          find src-tauri/target -name "*.dmg" 2>/dev/null | xargs -I{} cp {} artifacts/ 2>/dev/null || true
          # Windows
          find src-tauri/target -path "*/bundle/msi/*.msi" 2>/dev/null | xargs -I{} cp {} artifacts/ 2>/dev/null || true
          find src-tauri/target -path "*/bundle/nsis/*.exe" 2>/dev/null | xargs -I{} cp {} artifacts/ 2>/dev/null || true
          echo "=== Conteúdo da pasta artifacts/ ==="
          ls -lah artifacts/ 2>/dev/null || echo "(vazio)"

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Movex-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 3: Publicar Release (apenas em tags v*)
  # ──────────────────────────────────────────────────────────────
  release:
    name: Publicar Release GitHub
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Baixar artefatos macOS
        uses: actions/download-artifact@v4
        with:
          name: Movex-macOS
          path: release-assets/
        continue-on-error: true

      - name: Baixar artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: Movex-Windows
          path: release-assets/
        continue-on-error: true

      - name: Listar artefatos
        run: find release-assets -type f | sort || echo "(nenhum)"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Movex ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Movex ${{ github.ref_name }}

            Controle múltiplos computadores com um único teclado e mouse pela rede local.

            ---

            ### 📦 Downloads

            | Plataforma | Arquivo | Requisito |
            |---|---|---|
            | **macOS** | `Movex_*.dmg` | macOS 12+ · Apple Silicon + Intel |
            | **Windows** | `Movex_*.msi` | Windows 10/11 · x64 |
            | **Windows** | `Movex_*.exe` | Windows 10/11 · x64 |

            ---

            ### 🚀 Como usar

            1. Instale o Movex nos **dois** computadores
            2. No computador principal, selecione **Servidor**
            3. No outro, selecione **Cliente** e use a mesma chave de segurança
            4. Mova o cursor para a **borda da tela** para passar o controle

            ---

            Rust · Tauri 2 · TLS 1.3 · mDNS · TypeScript
          files: release-assets/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
