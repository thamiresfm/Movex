name: Build Movex

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Testes Rust (Ubuntu 24.04 — webkit2gtk-4.1 + soup3)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Testes Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu24-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu24-cargo-

      - name: Instalar dependências do sistema (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Executar testes Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
        env:
          RUST_LOG: info

  # ──────────────────────────────────────────────────────────────
  # Job 2: Build macOS (Universal Binary — Intel + Apple Silicon)
  # ──────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Rust (targets Universal Binary)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Instalar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências npm
        run: npm ci

      - name: Build Movex macOS
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          RUST_LOG: warn

      - name: Listar TODOS os artefatos gerados
        run: |
          echo "=== Estrutura completa do bundle ==="
          find src-tauri/target -name "*.dmg" -o -name "*.app" -o -name "*.pkg" 2>/dev/null | head -40 || echo "Nenhum artefato encontrado"
          echo ""
          echo "=== Diretórios release/bundle ==="
          find src-tauri/target -type d -name "bundle" 2>/dev/null | head -10

      - name: Upload artefatos macOS (todos os formatos)
        uses: actions/upload-artifact@v5
        with:
          name: Movex-macOS
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build Windows (x64)
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Instalar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências npm
        run: npm ci

      - name: Build Movex Windows
        run: npm run tauri build
        env:
          RUST_LOG: warn

      - name: Listar artefatos gerados
        run: |
          Write-Host "=== Bundle Windows ==="
          Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.msi,*.exe -ErrorAction SilentlyContinue | Select-Object FullName
        shell: pwsh

      - name: Upload artefatos Windows (.msi)
        uses: actions/upload-artifact@v5
        with:
          name: Movex-Windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artefatos Windows (.exe)
        uses: actions/upload-artifact@v5
        with:
          name: Movex-Windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 4: Publicar Release (apenas em tags v*)
  # ──────────────────────────────────────────────────────────────
  release:
    name: Publicar Release GitHub
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar artefatos macOS
        uses: actions/download-artifact@v5
        with:
          name: Movex-macOS
          path: release-assets/macos
        continue-on-error: true

      - name: Baixar artefatos Windows MSI
        uses: actions/download-artifact@v5
        with:
          name: Movex-Windows-msi
          path: release-assets/windows
        continue-on-error: true

      - name: Baixar artefatos Windows EXE
        uses: actions/download-artifact@v5
        with:
          name: Movex-Windows-exe
          path: release-assets/windows
        continue-on-error: true

      - name: Listar artefatos para o release
        run: find release-assets -type f | sort

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Movex ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Movex ${{ github.ref_name }}

            Controle múltiplos computadores com um único teclado e mouse pela rede local.

            ---

            ### 📦 Downloads

            | Plataforma | Arquivo | Requisito |
            |---|---|---|
            | **macOS** | `Movex_*.dmg` | macOS 12+ · Apple Silicon + Intel |
            | **Windows** | `Movex_*.msi` | Windows 10/11 · x64 |
            | **Windows** | `Movex_*.exe` | Windows 10/11 · x64 |

            ---

            ### 🚀 Como usar

            1. Instale o Movex nos **dois** computadores
            2. No computador principal, selecione **Servidor**
            3. No outro, selecione **Cliente** e use a mesma chave de segurança
            4. Mova o cursor para a **borda da tela** para passar o controle

            ---

            ### ⚙️ Stack Técnico
            Rust · Tauri 2 · TLS 1.3 (rustls) · mDNS · TypeScript
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
