name: Build Movex

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # Testes Rust (roda em ubuntu para ser rápido)
  # ──────────────────────────────────────────
  test:
    name: Testes Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Instalar dependências do sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Executar testes
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ──────────────────────────────────────────
  # Build macOS (Universal Binary: Intel + Apple Silicon)
  # ──────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust stable (Universal Binary)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências npm
        run: npm install

      - name: Build Movex (macOS Universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Movex-macOS-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: Movex-macOS-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  # ──────────────────────────────────────────
  # Build Windows (x64)
  # ──────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências npm
        run: npm install

      - name: Build Movex (Windows)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: Movex-Windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload .exe (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: Movex-Windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ──────────────────────────────────────────
  # Release automático ao criar uma tag v*
  # ──────────────────────────────────────────
  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixar artefatos macOS .dmg
        uses: actions/download-artifact@v4
        with:
          name: Movex-macOS-dmg
          path: artifacts/macos

      - name: Baixar artefatos Windows .msi
        uses: actions/download-artifact@v4
        with:
          name: Movex-Windows-msi
          path: artifacts/windows-msi

      - name: Baixar artefatos Windows .exe
        uses: actions/download-artifact@v4
        with:
          name: Movex-Windows-exe
          path: artifacts/windows-exe

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Movex ${{ github.ref_name }}"
          body: |
            ## Movex ${{ github.ref_name }}

            Controle múltiplos computadores com um único teclado e mouse pela rede local.

            ### Downloads

            | Plataforma | Arquivo | Formato |
            |---|---|---|
            | macOS (Universal) | `Movex_*.dmg` | Instalador DMG |
            | Windows 10/11 | `Movex_*.msi` | Instalador MSI |
            | Windows 10/11 | `Movex_*.exe` | Instalador NSIS |

            ### Requisitos
            - **macOS:** 12 (Monterey) ou superior · Apple Silicon e Intel
            - **Windows:** Windows 10 build 1903+ · x64

            ### Primeiros passos
            1. Instale o Movex nos dois computadores
            2. No primeiro, selecione **Servidor**
            3. No segundo, selecione **Cliente** e use a mesma chave de segurança
            4. Mova o cursor para a borda da tela para passar o controle
          draft: false
          prerelease: false
          files: |
            artifacts/macos/*.dmg
            artifacts/windows-msi/*.msi
            artifacts/windows-exe/*.exe
          fail_on_unmatched_files: false
