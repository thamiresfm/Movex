# Gera GitHub Release + instaladores .dmg / .exe / .msi. Dispara SÓ com: git tag v* && git push origin v*
# (Push em `main` não dispara este ficheiro — isso fica no workflow `ci.yml`.)
# Build **sem** Release (só artefatos na aba Actions): workflow *Desktop — DMG e EXE (artefatos)*.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint, testes Rust e build frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ubuntu24-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu24-cargo-
      - name: Instalar dependências Linux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config \
            cmake nasm clang libdbus-1-dev
      - name: Clippy (warnings como erros)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings 2>&1
      - name: Testes Rust (crate completo)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Vitest e build Vite
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run test
          npm run build
      - name: Artefato frontend (verificação)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: movex-frontend-dist-tag-build
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Criar GitHub Release
    runs-on: ubuntu-24.04
    needs: [test]
    outputs:
      release_id: ${{ steps.gh_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Criar release no GitHub
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Movex ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Movex ${{ github.ref_name }}

            Controle múltiplos computadores com um único teclado e mouse pela rede local.

            ### Downloads

            | Plataforma | Arquivo |
            |---|---|
            | macOS (Apple Silicon + Intel) | `Movex_*_universal.dmg` |
            | Windows 10/11 x64 | `Movex_*_x64_en-US.msi` |
            | Windows 10/11 x64 | `Movex_*_x64-setup.exe` |

            ### Como usar
            1. Instale o Movex nos dois computadores
            2. No principal, **Servidor**
            3. No outro, **Cliente** com o IP do servidor (TLS)
            4. Mova o cursor para a borda da tela para passar o controle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          # Workspace Cargo: target/ está na raiz do repo, não em src-tauri/.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências npm
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Build apenas o .app (sem .dmg) — o .dmg será criado depois do
      # re-codesign para incluir a assinatura estável.
      - name: Build .app universal (sem DMG)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm install -g @tauri-apps/cli@^2
          tauri build --target universal-apple-darwin --bundles app

      # Re-assinar com identifier ESTÁVEL (com.movex.app). O linker do Rust
      # gera identifier aleatório (movex-XXXXXXX) a cada build, e o TCC do
      # macOS guarda permissões de Acessibilidade/Input Monitoring por
      # CD hash desse identifier. Sem este passo o utilizador é forçado a
      # remover e re-adicionar Movex em Privacidade & Segurança a cada
      # release — Deskflow documenta o mesmo problema.
      #
      # `--options runtime` ativa hardened runtime; `--entitlements` aplica
      # as flags get-task-allow/disable-library-validation/allow-jit que o
      # CGEventTap precisa.
      - name: Re-assinar .app com identifier estável + hardened runtime
        run: |
          set -euo pipefail
          BUNDLE="target/universal-apple-darwin/release/bundle/macos/Movex.app"
          ls -la "$BUNDLE"
          codesign --force --deep --options runtime \
            --entitlements src-tauri/entitlements.plist \
            --sign - --identifier com.movex.app \
            "$BUNDLE"
          echo "--- assinatura final ---"
          codesign -dvvv "$BUNDLE" 2>&1 | grep -E "Identifier|flags|Signature" | head -5

      # Empacotar .dmg manualmente via hdiutil — não usamos o bundle do
      # Tauri porque ele recompila o .app, perdendo a assinatura estável.
      #
      # Guard anti-Spotlight: o mdworker do macOS indexa o .app recém-copiado
      # e segura um file lock, causando "Resource busy". Mitigações:
      #   1. xattr -cr  — remove atributos estendidos (inclusive quarantine)
      #   2. .metadata_never_index — instrui Spotlight a ignorar o stage dir
      #   3. Loop de retry com sleep — aguarda o indexador soltar o lock
      - name: Criar DMG manualmente (com .app re-assinado)
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE="target/universal-apple-darwin/release/bundle/macos/Movex.app"
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$BUNDLE" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          # Prevenir lock do Spotlight / mdworker
          touch "$STAGE/.metadata_never_index"
          xattr -cr "$STAGE/Movex.app" || true

          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          DMG="$DMG_DIR/Movex_${VERSION}_universal.dmg"

          # Retry: hdiutil pode falhar com "Resource busy" se o mdworker ainda
          # segura o lock. 3 tentativas com 15s de intervalo resolvem na prática.
          for attempt in 1 2 3; do
            if hdiutil create -volname "Movex ${VERSION}" \
              -srcfolder "$STAGE" -ov -format UDZO "$DMG"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "hdiutil falhou após 3 tentativas"
              exit 1
            fi
            echo "Tentativa $attempt falhou — aguardando 15s antes de tentar novamente..."
            sleep 15
          done

          ls -la "$DMG_DIR"

      # Upload manual do .dmg ao Release já criado (pelo job `release`).
      - name: Upload DMG ao Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Movex_${VERSION}_universal.dmg"
          gh release upload "v${VERSION}" "$DMG" --clobber

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências npm
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Certificado Windows (opcional)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "Sem WINDOWS_CERTIFICATE — a compilar sem assinatura de código."
            exit 0
          }
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = "$env:TEMP\movex-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, $certBytes)
          $pwd = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Write-Host "Certificado instalado."
      - name: Build e upload Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.release_id }}
